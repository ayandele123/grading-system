<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>grading system for university</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
  </head>
  <body>

    <div class="col-4 mt-4 col-lg-4 col-md-6 col-sm-6 mx-auto p-4 p-lg-5 border shadow">
      <h3 class="text-decoration-underline text-center mb-3 fs-5">Grading System For University</h3>
      <input class="form-control form-control-sm shadow-none" type="number"  id="input" placeholder="enter your score">
      <div class="text-center mt-3 fs-6" id="display"> your result will show here</div>
      <button class="btn mt-4 btn-danger d-block mx-auto" onclick="show()">check your grade</button>
    </div>
    
    
  </body>
</html>
